    <!-- Critical CSS inline expandido para Speed Index -->
    <style>
      /* Reset e base críticos */
      *{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;font-size:16px}
      body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;text-rendering:optimizeSpeed;overflow-x:hidden}
      
      /* Hero section crítico para Speed Index */

        background-position:center;
        background-repeat:no-repeat;
        min-height:100vh;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        contain:layout style paint;
        will-change:transform;
      }
      
      /* Overlay crítico */
      .hero-overlay{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,0.6);
        z-index:1;
      }
      
      /* Container crítico */
      .hero-container{
        position:relative;
        z-index:10;
        text-align:center;
        color:#fff;
        max-width:1200px;
        margin:0 auto;
        padding:0 1rem;
      }
      
      /* Tipografia crítica */
      .hero-title{
        font-size:clamp(2rem,8vw,4.5rem);
        font-weight:700;
        margin-bottom:1rem;
        line-height:1.1;
        letter-spacing:-0.02em;
        color:#fff;
      }
      
      .hero-subtitle{
        font-size:clamp(1.25rem,4vw,2.25rem);
        font-weight:300;
        margin-bottom:1.5rem;
        color:#d1d5db;
        line-height:1.2;
      }
      
      .hero-description{

        max-width:48rem;
        margin-left:auto;
        margin-right:auto;

        color:#e5e7eb;

      /* Botões críticos */
      .hero-buttons{

      }

      }
      
      .btn{

        align-items:center;
        justify-content:center;

        border-radius:0.5rem;
        font-weight:600;
        text-decoration:none;
        transition:all 0.2s ease;
        cursor:pointer;
        border:none;
        font-size:1rem;
        white-space:nowrap;
        min-width:160px;
        touch-action:manipulation;
        -webkit-tap-highlight-color:transparent;
      }
      
      .btn-primary{
        background:#3b82f6;
        color:#fff;
      }
      
      .btn-primary:hover{
        background:#2563eb;
        transform:translateY(-1px);
      }
      
      .btn-outline{
        background:transparent;
        color:#fff;
        border:2px solid #fff;
      }
      
      .btn-outline:hover{
        background:#fff;
        color:#000;
      }
      
      /* Navigation crítica */
      .nav-fixed{
        position:fixed;
        top:0;
        left:0;
        right:0;
        z-index:50;
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        background:rgba(17,24,39,0.95);
        border-bottom:1px solid rgba(75,85,99,0.5);

        margin:0 auto;
        padding:0 1rem;
        display:flex;
        align-items:center;
        justify-content:space-between;
        width:100%;

        text-decoration:none;
      }

        gap:2rem;
        list-style:none;

      }
      
      /* Performance optimizations */
      img{max-width:100%;height:auto;display:block;content-visibility:auto}
      .container{contain:layout style paint}
      .transform{transform:translateZ(0);will-change:transform}
      
      /* Reduce layout shifts */
      .aspect-square{aspect-ratio:1/1}
      
      /* GPU acceleration for animations */
      .animate-pulse{animation:pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;transform:translateZ(0)}
      .animate-bounce{animation:bounce 1s infinite;transform:translateZ(0)}
      
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
      @keyframes bounce{0%,100%{transform:translateY(-25%) translateZ(0);animation-timing-function:cubic-bezier(0.8,0,1,1)}50%{transform:translateY(0) translateZ(0);animation-timing-function:cubic-bezier(0,0,0.2,1)}}
      
      /* Optimize for reduced motion */
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
      
      /* Loading state otimizado */
      #root{min-height:100vh;contain:layout style}
      .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000}
      
      /* Mobile background fix */
      @media (max-width:768px){
        .hero-section{
          background-attachment:scroll!important;
        }
      }
      
      /* Scroll indicator crítico */
      .scroll-indicator{
        position:absolute;
        bottom:2rem;
        left:50%;
        transform:translateX(-50%);
        width:1.5rem;
        height:2.5rem;
        border:2px solid rgba(255,255,255,0.5);
        border-radius:1.25rem;
        display:flex;
        justify-content:center;
        animation:bounce 1s infinite;
      }
      
      .scroll-dot{
        width:0.25rem;
        height:0.75rem;
        background:rgba(255,255,255,0.5);
        border-radius:0.125rem;
        margin-top:0.5rem;
        animation:pulse 2s infinite;
      }
      
      @media (max-width:640px){
        .scroll-indicator{
          display:none;
        }
      }

    <!-- Async load non-critical CSS otimizado -->
    <script>
      // Optimized CSS loader para Speed Index
      function loadCSS(href,media,integrity){
        var ss=document.createElement('link');
        ss.rel='stylesheet';
        ss.href=href;
        ss.media=media||'all';
        if(integrity)ss.integrity=integrity;
        ss.crossOrigin='anonymous';
        document.head.appendChild(ss);
        return ss;
      }
      
      // Load external CSS com prioridade otimizada
      requestIdleCallback(function(){
        loadCSS('https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css');
        loadCSS('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');
      });
      
      // Fallback para navegadores sem requestIdleCallback
      if(!window.requestIdleCallback){
        setTimeout(function(){
          loadCSS('https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css');
          loadCSS('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');
        },200);
      }
    </script>
